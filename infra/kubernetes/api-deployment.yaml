apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgti-api
  namespace: sgti-platform
  labels:
    app: sgti-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sgti-api
  template:
    metadata:
      labels:
        app: sgti-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8050"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sgti-api
          image: ghcr.io/ankdeshm/social-graph-trust-intelligence:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8050
              name: http
          env:
            - name: SGTI_RUNTIME_MODE
              value: "local_native"
            - name: SGTI_API_HOST
              value: "0.0.0.0"
            - name: SGTI_API_PORT
              value: "8050"
            - name: SGTI_DATA_DIR
              value: "/data/sgti"
            - name: SGTI_VIEWER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sgti-api-keys
                  key: viewer_key
            - name: SGTI_ANALYST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sgti-api-keys
                  key: analyst_key
            - name: SGTI_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sgti-api-keys
                  key: admin_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8050
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8050
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sgti-api
  namespace: sgti-platform
spec:
  selector:
    app: sgti-api
  ports:
    - name: http
      port: 8050
      targetPort: 8050
