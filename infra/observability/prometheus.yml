global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "sgti-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["sgti-api:8050"]
        labels:
          service: "social-graph-trust-intelligence"
          runtime: "local_native"
