name: social-graph-trust-intelligence

services:
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["core", "full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "sgti-kraft-cluster-0001"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.5
    profiles: ["core", "full"]
    ports:
      - "8081:8080"
    environment:
      QUARKUS_HTTP_PORT: "8080"
      APICURIO_STORAGE_KIND: "mem"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["core", "full"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-sgti_minio_local}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-sgti_minio_local_secret}"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  postgres-oltp:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    profiles: ["core", "full"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-social_graph_oltp}"
      POSTGRES_USER: "${POSTGRES_USER:-sgti_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-local-only}"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgti_app} -d ${POSTGRES_DB:-social_graph_oltp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    profiles: ["core", "full"]
    depends_on:
      postgres-oltp:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "${LAKEKEEPER_ENC_KEY:-local-dev-key-32-chars-minimum-01}"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://${POSTGRES_USER:-sgti_app}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres-oltp:5432/${POSTGRES_DB:-social_graph_oltp}"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://${POSTGRES_USER:-sgti_app}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres-oltp:5432/${POSTGRES_DB:-social_graph_oltp}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  sgti-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    image: social-graph-trust-intelligence:0.1.0
    profiles: ["core", "full"]
    ports:
      - "8050:8050"
    environment:
      SGTI_RUNTIME_MODE: "local_native"
      SGTI_API_HOST: "0.0.0.0"
      SGTI_API_PORT: "8050"
      SGTI_DATA_DIR: "/data/sgti"
      SGTI_VIEWER_API_KEY: "${SGTI_VIEWER_API_KEY:-dev-viewer-key-local-only}"
      SGTI_ANALYST_API_KEY: "${SGTI_ANALYST_API_KEY:-dev-analyst-key-local-only}"
      SGTI_ADMIN_API_KEY: "${SGTI_ADMIN_API_KEY:-dev-admin-key-local-only}"
    volumes:
      - sgti_local_data:/data/sgti
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  spark-graph:
    image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
    profiles: ["analytics", "full"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8085:8080"
    volumes:
      - ./processing/spark:/opt/sgti/spark:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  trino:
    image: trinodb/trino:484
    profiles: ["analytics", "full"]
    ports:
      - "8086:8080"
    volumes:
      - ./sql/trino:/etc/trino/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M

  airflow:
    image: apache/airflow:slim-3.4.0-python3.12
    profiles: ["analytics", "full"]
    command: ["standalone"]
    ports:
      - "8087:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./processing/airflow/dags:/opt/airflow/dags:ro
    deploy:
      resources:
        limits:
          memory: 1536M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:13.0.14
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}"
    volumes:
      - ./infra/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/sgti.json:ro
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:3.6.22
    profiles: ["observability", "full"]
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0-${OTEL_ARCH:-arm64}
    profiles: ["observability", "full"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  marquez:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    profiles: ["observability", "full"]
    ports:
      - "5000:5000"
      - "5001:5001"
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  kafka_data:
  rustfs_data:
  postgres_data:
  sgti_local_data:
